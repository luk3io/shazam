<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Luke's Shazammer</title>
<style>/*__STYLES__*/</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <button class="secondary hidden" id="homeBtn">☰ Start over</button>
    <div id="tracker"></div>
  </div>
  <div id="stage">
    <canvas id="stageCanvas"></canvas>
    <div id="start">
      <h1>Luke's Shazammer</h1>
      <div id="modeTabs">
        <button class="modeTab" id="tabMic">🎤 Microphone</button>
        <button class="modeTab" id="tabLibrary">📚 Library</button>
      </div>
      <div id="library">
        <div id="libraryTitle"></div>
        <div id="songCards"></div>
      </div>
      <div id="micMode" class="modepane">
        <div class="modes">
          <button id="modeLive">🎤 Enable microphone</button>
          <button id="recordBtn" class="hidden">● Record &amp; identify</button>
        </div>
        <label id="normToggle"><input type="checkbox" id="normChk" checked /> Even out recording volume (normalize)</label>
      </div>
      <div id="libMode" class="modepane hidden">
        <button id="modeCanned">⏺ Capture Song</button>
      </div>
      <div id="status">Preparing song database…</div>
      <div class="startbtns">
        <button class="secondary" id="fsBtn">⛶ Fullscreen</button>
        <button class="secondary" id="resetDbBtn">↻ Rebuild database</button>
      </div>
    </div>
    <div id="loading">Analysing… <span id="loadPct"></span></div>
    <div id="levelMeter" class="hidden"><div id="levelBar"></div></div>
  </div>
  <div id="caption"></div>
  <button id="stopRecBtn" class="hidden">■ Stop</button>
  <div id="controls" class="hidden">
    <button class="secondary hidden" id="playBtn">▶ Play clip</button>
    <button class="secondary hidden" id="fpModeBtn">⇄ View: Spread</button>
    <button class="secondary" id="prevBtn">◀ Prev</button>
    <button id="nextBtn">Next ▶ (Space)</button>
    <button class="secondary" id="replayBtn">↺ Replay (R)</button>
  </div>
</div>
<script>/*__SONGS__*/</script>
<script>/*__WORKER__*/</script>
<script>/*__SCRIPT__*/</script>
</body>
</html>
